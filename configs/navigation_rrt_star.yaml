name: "navigation_rrt_star_baseline"
seed: 42

algorithm:
  name: "rrt_star"
  parameters:
    step_size: 0.5
    max_iterations: 1500
    goal_bias: 0.1
    search_radius: 1.5

environment:
  name: "navigation"
  max_steps: 200
  parameters:
    arena_width: 20.0
    arena_height: 20.0
    num_obstacles: 5
    obstacle_radius: 1.0
    agent_radius: 0.3
    goal_radius: 0.8

evaluation:
  eval_episodes: 10
  deterministic: true

output_dir: "experiments/results"
log_dir: "experiments/logs"
