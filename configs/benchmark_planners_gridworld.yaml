# GridWorld Classical A* vs Reinforcement Learning Benchmark Configuration
name: "benchmark_gridworld_astar"
seed: 42
algorithm:
  name: "ppo"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  parameters:
    n_steps: 128
    ent_coef: 0.01

environment:
  name: "gridworld"
  max_steps: 50
  parameters:
    width: 8
    height: 8
    num_obstacles: 6
    step_reward: -1.0
    goal_reward: 100.0
    collision_reward: -100.0

training:
  total_timesteps: 10000
  checkpoint_freq: 5000
  log_interval: 10

evaluation:
  eval_episodes: 20
  deterministic: true

output_dir: "experiments/results/benchmark_astar"
log_dir: "experiments/logs/benchmark_astar"
