# Continuous Navigation Classical RRT* vs Reinforcement Learning Benchmark Configuration
name: "benchmark_navigation_rrt"
seed: 42
algorithm:
  name: "sac"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  parameters:
    buffer_size: 10000
    learning_starts: 500

environment:
  name: "navigation"
  max_steps: 100
  parameters:
    arena_width: 20.0
    arena_height: 20.0
    num_obstacles: 5
    obstacle_radius: 1.0
    agent_radius: 0.3
    goal_radius: 0.8
    step_reward: -0.05
    goal_reward: 100.0
    collision_reward: -100.0

training:
  total_timesteps: 10000
  checkpoint_freq: 5000
  log_interval: 10

evaluation:
  eval_episodes: 20
  deterministic: true

output_dir: "experiments/results/benchmark_rrt"
log_dir: "experiments/logs/benchmark_rrt"
